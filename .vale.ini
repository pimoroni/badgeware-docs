StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Badgeware

[*.md]
BasedOnStyles = Vale, Badgeware

# Vale.Terms enforces the exact casing of every vocabulary entry, which trips on
# any term at the start of a sentence or in a heading.
Vale.Terms = NO
# Replaced by Badgeware.Spelling, which ignores snake_case identifiers.
Vale.Spelling = NO
