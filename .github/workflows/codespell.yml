name: Codespell

on:
  push:
    branches: [main]
  pull_request:

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install codespell
        run: python -m pip install codespell

      - name: Check spelling
        run: codespell
